<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matroš · rozvrhoR</title>

    <link rel="stylesheet" href="matrosstyle.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="matros-page">

        <!-- SPÄŤ -->
        <div class="matros-top">
            <button id="back-button" type="button">
                <span class="back-arrow">←</span>
                flip a bitch
            </button>
        </div>


        <!-- HLAVIČKA PREDMETU -->
        <header class="subject-header">

            <h1 id="matros-title">
                Matroš
            </h1>

            <p id="matros-info">
                Materiály k predmetu
            </p>

        </header>


        <!-- HLAVNÝ OBSAH -->
        <section class="matros-content">

            <div class="content-heading">

                <h2>
                    Materiály
                </h2>

                <button
                    id="upload-button"
                    type="button"
                    class="upload-button"
                >
                    + Nahrať materiál
                </button>

            </div>


            <!-- ZOZNAM MATERIÁLOV -->
            <div
                id="materials-list"
                class="file-list"
            >
                <!-- materiály sa zobrazia sem -->
            </div>

        </section>

    </main>


    <script src="matrosscript.js"></script>

</body>
</html>
